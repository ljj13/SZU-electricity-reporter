name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and regression test suite
        run: |
          python -m unittest discover -s tests -t . -v

      - name: Verify CLI basic functionality
        run: |
          python main.py --help

      - name: Validate shell scripts syntax (Linux)
        if: runner.os == 'Linux'
        run: |
          for script in run-once.sh deploy/*.sh; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done

      - name: Validate PowerShell scripts syntax (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scripts = @(
            'deploy/deploy.ps1',
            'install_scheduled_task.ps1',
            'uninstall_scheduled_task.ps1'
          )
          foreach ($s in $scripts) {
            Write-Host "Checking PowerShell syntax: $s"
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $s), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
